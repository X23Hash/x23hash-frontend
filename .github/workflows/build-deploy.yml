name: Build and deploy

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# 배포 순서가 뒤집히지 않도록 같은 브랜치의 실행을 직렬화합니다.
concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node --test scripts/app-test-release.test.mjs

  web:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          # 카카오 클라이언트 키는 브라우저에 노출되는 공개 식별자입니다.
          EXPO_PUBLIC_KAKAO_CLIENT_ID: ${{ vars.EXPO_PUBLIC_KAKAO_CLIENT_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: web-${{ github.sha }}
          path: dist
          if-no-files-found: error
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::GitHub secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required."
            exit 1
          fi
          # main은 프로덕션(x23hash.pages.dev), develop은 미리보기(develop.x23hash.pages.dev)로 배포됩니다.
          npx --yes wrangler@4 pages deploy dist --project-name x23hash --branch "$TARGET_BRANCH"

  app-test:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.APP_TEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Detect app changes and release to testers
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/app-test-release.mjs ${{ matrix.platform }}
